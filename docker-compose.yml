services:
  nockchain-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.nockchain
    container_name: nockchain-fakenet
    volumes:
      - ./data:/data
      - ./config:/config
      - ./config/genesis/fakenet-pkh9yPe-pow2-bex1.jam:/genesis.jam:ro
    ports:
      - "8545:8545"    # RPC
      - "8546:8546"    # WebSocket
      - "30303:30303"  # P2P
      - "5555:5555"    # gRPC
    environment:
      - MINING_PKH=9yPePjfWAdUnzaQKyxcRXKRa5PpUzKKEwtpECBZsUYt9Jd7egSDEWoV
      - FAKENET=true
      - POW_LEN=2
      - COINBASE_TIMELOCK_MIN=0
    networks:
      - nockchain-fakenet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  nockchain-fakenet:
    driver: bridge